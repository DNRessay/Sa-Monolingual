name: Deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - "aws/**"
      - "config.py"
      - "fetch.py"
      - "process.py"
      - "push.py"
  workflow_dispatch: {}

# Only one deploy runs at a time -- CloudFormation rejects a second mutation
# while the first is still in progress ("stack ... is in CREATE_IN_PROGRESS
# state and can not be updated"), which happens if this workflow gets
# re-triggered or manually re-run before the previous run finishes. Queue
# instead of racing; don't cancel a deploy that's already underway.
concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false

# Start here with access-key secrets while you're learning the pipeline.
# Once it's working, switch to OIDC (permissions: id-token: write, and
# aws-actions/configure-aws-credentials with role-to-assume) so no long-lived
# AWS keys have to live in GitHub at all.
#
# Secrets required (Settings -> Secrets and variables -> Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  -- deploy permissions
#   HF_TOKEN                                  -- HF write token for PushFunction
#                                                 (passed as a CloudFormation
#                                                 parameter, GitHub masks it in
#                                                 the logs, it's never written
#                                                 to samconfig.toml)

env:
  AWS_REGION: eu-west-1
  STACK_NAME: sa-languages-corpus

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2

      # A stack in ROLLBACK_COMPLETE / ROLLBACK_FAILED / REVIEW_IN_PROGRESS has no
      # usable resources but still blocks the next deploy. CloudFormation will not
      # update out of those states -- the stack has to be deleted first. Same for
      # SAM's CompanionStack (holds the ECR repos for image-based functions) and
      # its managed bootstrap stack.
      - name: Clear wedged stacks
        run: |
          set -u
          BAD_STATES="ROLLBACK_COMPLETE ROLLBACK_FAILED REVIEW_IN_PROGRESS CREATE_FAILED DELETE_FAILED UPDATE_ROLLBACK_FAILED"

          clear_stack () {
            local name="$1"
            local status
            status=$(aws cloudformation describe-stacks \
                       --stack-name "$name" \
                       --region "$AWS_REGION" \
                       --query "Stacks[0].StackStatus" \
                       --output text 2>/dev/null || echo "MISSING")

            if [ "$status" = "MISSING" ]; then
              echo "  $name: does not exist, nothing to clear"
              return 0
            fi

            if echo "$BAD_STATES" | grep -qw "$status"; then
              echo "  $name: $status -> deleting"

              # a non-empty S3 bucket blocks stack deletion, so drain any the stack owns
              for b in $(aws cloudformation describe-stack-resources \
                           --stack-name "$name" --region "$AWS_REGION" \
                           --query "StackResources[?ResourceType=='AWS::S3::Bucket'].PhysicalResourceId" \
                           --output text 2>/dev/null || true); do
                [ -n "$b" ] && echo "    emptying s3://$b" && \
                  aws s3 rm "s3://$b" --recursive --region "$AWS_REGION" >/dev/null 2>&1 || true
              done

              aws cloudformation delete-stack --stack-name "$name" --region "$AWS_REGION"
              aws cloudformation wait stack-delete-complete \
                --stack-name "$name" --region "$AWS_REGION" 2>/dev/null || true
              echo "  $name: cleared"
            else
              echo "  $name: $status (healthy, leaving alone)"
            fi
          }

          echo "Checking main stack..."
          clear_stack "$STACK_NAME"

          echo "Checking SAM bootstrap stack..."
          clear_stack "aws-sam-cli-managed-default"

          echo "Checking companion stacks..."
          for s in $(aws cloudformation list-stacks \
                       --region "$AWS_REGION" \
                       --stack-status-filter $BAD_STATES \
                       --query "StackSummaries[?contains(StackName, 'sa-languages-corpus')].StackName" \
                       --output text 2>/dev/null || true); do
            [ -n "$s" ] && clear_stack "$s"
          done

      - name: sam build
        run: sam build -t aws/template.yaml

      - name: sam deploy
        run: |
          sam deploy \
            --config-file aws/samconfig.toml \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "Stage=dev HfToken=${{ secrets.HF_TOKEN }}"

      - name: Show stack outputs
        if: success()
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table

      # On failure, surface the real CloudFormation reason -- SAM CLI usually
      # reports a generic waiter timeout instead of the underlying error, and
      # the actual failure is very often in the CompanionStack (holds the ECR
      # repos for image-based functions) rather than the main stack itself.
      - name: Diagnose failure
        if: failure()
        run: |
          for name in "$STACK_NAME" "aws-sam-cli-managed-default"; do
            echo "=== $name ==="
            events=$(aws cloudformation describe-stack-events \
              --stack-name "$name" --region "$AWS_REGION" \
              --query "StackEvents[?contains(ResourceStatus,'FAILED') || contains(ResourceStatus,'ROLLBACK')].[LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
              --output table 2>/dev/null)
            if [ -n "$events" ]; then
              echo "$events"
            else
              echo "  (no events, or stack no longer exists -- see companion stacks below)"
            fi
          done

          echo "=== companion stacks ==="
          for s in $(aws cloudformation list-stacks \
                       --region "$AWS_REGION" \
                       --query "StackSummaries[?contains(StackName, 'sa-languages-corpus') && StackStatus != 'DELETE_COMPLETE' && StackName != '$STACK_NAME'].StackName" \
                       --output text 2>/dev/null || true); do
            echo "--- $s ---"
            aws cloudformation describe-stack-events \
              --stack-name "$s" --region "$AWS_REGION" \
              --query "StackEvents[?contains(ResourceStatus,'FAILED') || contains(ResourceStatus,'ROLLBACK')].[LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
              --output table 2>/dev/null
          done
