AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  sa-languages-corpus pipeline: S3 for raw/clean data, a fetch Lambda and a
  process Lambda (both container images), orchestrated by one Step Functions
  state machine. No VPC, no NAT gateway -- nothing costs anything while idle.

Parameters:
  Stage:
    Type: String
    Default: dev
  HfToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Hugging Face write token for Mehgoss/sa-languages-corpus. Only given to
      PushFunction. Pass it at deploy time (--parameter-overrides), never commit
      it to samconfig.toml.

Globals:
  Function:
    Timeout: 900
    Environment:
      Variables:
        DATA_BUCKET: !Ref DataBucket

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "sa-languages-corpus-${AWS::AccountId}-${Stage}"
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawShardsAfter1Day
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 1

  FetchFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: 3008
      EphemeralStorage:
        Size: 10240
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
    Metadata:
      Dockerfile: aws/functions/fetch/Dockerfile
      DockerContext: ..
      DockerTag: fetch-latest

  ProcessFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: 3008
      EphemeralStorage:
        Size: 10240
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
    Metadata:
      Dockerfile: aws/functions/process/Dockerfile
      DockerContext: ..
      DockerTag: process-latest

  PushFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: 3008
      EphemeralStorage:
        Size: 10240
      Environment:
        Variables:
          HF_TOKEN: !Ref HfToken
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
    Metadata:
      Dockerfile: aws/functions/push/Dockerfile
      DockerContext: ..
      DockerTag: push-latest

  PipelineStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "sa-languages-corpus-${Stage}"
      DefinitionUri: statemachine.asl.json
      DefinitionSubstitutions:
        FetchFunctionArn: !GetAtt FetchFunction.Arn
        ProcessFunctionArn: !GetAtt ProcessFunction.Arn
        PushFunctionArn: !GetAtt PushFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref FetchFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ProcessFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref PushFunction

Outputs:
  BucketName:
    Value: !Ref DataBucket
  StateMachineArn:
    Value: !Ref PipelineStateMachine
  FetchFunctionName:
    Value: !Ref FetchFunction
  ProcessFunctionName:
    Value: !Ref ProcessFunction
  PushFunctionName:
    Value: !Ref PushFunction
