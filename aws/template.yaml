AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  sa-languages-corpus pipeline: S3 for raw/clean data, a fetch Lambda and a
  process Lambda (both container images), orchestrated by one Step Functions
  state machine. No VPC, no NAT gateway -- nothing costs anything while idle.

Parameters:
  Stage:
    Type: String
    Default: dev

Globals:
  Function:
    Timeout: 900
    Environment:
      Variables:
        DATA_BUCKET: !Ref DataBucket

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "sa-languages-corpus-${AWS::AccountId}-${Stage}"
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawShardsAfter30Days
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 30

  FetchFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: 2048
      EphemeralStorage:
        Size: 10240
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
    Metadata:
      Dockerfile: aws/functions/fetch/Dockerfile
      DockerContext: ..
      DockerTag: fetch-latest

  ProcessFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      MemorySize: 8192
      EphemeralStorage:
        Size: 10240
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
    Metadata:
      Dockerfile: aws/functions/process/Dockerfile
      DockerContext: ..
      DockerTag: process-latest

  PipelineStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "sa-languages-corpus-${Stage}"
      DefinitionUri: statemachine.asl.json
      DefinitionSubstitutions:
        FetchFunctionArn: !GetAtt FetchFunction.Arn
        ProcessFunctionArn: !GetAtt ProcessFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref FetchFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ProcessFunction

Outputs:
  BucketName:
    Value: !Ref DataBucket
  StateMachineArn:
    Value: !Ref PipelineStateMachine
  FetchFunctionName:
    Value: !Ref FetchFunction
  ProcessFunctionName:
    Value: !Ref ProcessFunction
